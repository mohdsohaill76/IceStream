version: "3.8"

networks:
  icestream-network:
    name: icestream-network
    driver: bridge

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: icestream-kafka
    networks:
      - icestream-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: icestream-flink:1.19.2
    container_name: icestream-flink-jobmanager
    networks:
      - icestream-network
    depends_on:
      - kafka
    ports:
      - "8081:8081"

    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: icestream-flink-jobmanager
        parallelism.default: 1
    volumes:
      - ./flink:/opt/flink/flink_app

  taskmanager:
    image: icestream-flink:1.19.2
    container_name: icestream-flink-taskmanager
    networks:
      - icestream-network
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: icestream-flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
    volumes:
      - ./flink:/opt/flink/flink_app
